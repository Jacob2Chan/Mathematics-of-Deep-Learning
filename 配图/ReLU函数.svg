<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker></defs><rect width="1600" height="900" fill="#fff"/><rect x="50" y="45" width="65" height="50" rx="12" fill="#14243b" stroke="none" stroke-width="2"/><text x="82" y="80" text-anchor="middle" fill="#fff" font-size="25" font-family="Microsoft YaHei">03</text><text x="140" y="84" text-anchor="start" fill="#14243b" font-size="38" font-family="Microsoft YaHei">ReLU：保留正值，截断负值</text><text x="140" y="125" text-anchor="start" fill="#607086" font-size="19" font-family="Microsoft YaHei">ACTIVATION  /  分段线性的非线性激活函数</text><path d="M50 153 L1550 153" stroke="#e2e8f0" stroke-width="2.5" fill="none" /><rect x="75" y="240" width="600" height="460" rx="18" fill="#ebf6ef" stroke="none" stroke-width="2"/><text x="375" y="345" text-anchor="middle" fill="#14243b" font-size="43" font-family="Cambria Math,Times New Roman">σ(t) = max{0, t}</text><text x="375" y="445" text-anchor="middle" fill="#14243b" font-size="34" font-family="Cambria Math,Times New Roman">t ≤ 0  ⇒  σ(t) = 0</text><text x="375" y="520" text-anchor="middle" fill="#14243b" font-size="34" font-family="Cambria Math,Times New Roman">t > 0  ⇒  σ(t) = t</text><text x="375" y="627" text-anchor="middle" fill="#607086" font-size="24" font-family="Microsoft YaHei">在原点连续，但不可微</text><path d="M790 630 L1480 630" stroke="#64748b" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M1050 730 L1050 230" stroke="#64748b" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="1500" y="642" text-anchor="middle" fill="#14243b" font-size="30" font-family="Cambria Math,Times New Roman">t</text><text x="1085" y="250" text-anchor="start" fill="#14243b" font-size="30" font-family="Cambria Math,Times New Roman">σ(t)</text><text x="1025" y="665" text-anchor="middle" fill="#14243b" font-size="25" font-family="Microsoft YaHei">0</text><path d="M820 630 L1050 630 L1400 280" stroke="#23846a" stroke-width="7" fill="none"/><text x="1360" y="410" text-anchor="middle" fill="#23846a" font-size="24" font-family="Microsoft YaHei">斜率 1</text></svg>